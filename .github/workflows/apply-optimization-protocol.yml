name: Apply optimization protocol to role definitions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-optimization-protocol.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch role definitions
        run: python .github/scripts/apply_optimization_protocol.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/roles/main_agent.md .agents/roles/reviewer_agent.md
          git commit -m "feat: bind optimization protocol to S2-S4 gates"
          git push origin HEAD:main
